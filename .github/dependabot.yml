version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # ICU4J 78+ requires Java 11+.
      - dependency-name: "com.ibm.icu:icu4j"
        versions:
          - ">= 78"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
